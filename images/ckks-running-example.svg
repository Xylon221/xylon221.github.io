<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360">
  <defs>
    <marker id="ex-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0f172a"/>
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans SC", sans-serif; fill:#111827; }
      .title { font-size:26px; font-weight:700; }
      .box { rx:10; stroke:#0f172a; stroke-width:1.4; }
      .data { fill:#fee2e2; }
      .plain { fill:#fed7aa; }
      .cipher { fill:#bfdbfe; }
      .compute { fill:#ddd6fe; }
      .result { fill:#dcfce7; }
      .h { font-size:18px; font-weight:700; }
      .b { font-size:14px; fill:#334155; }
      .arrow { stroke:#0f172a; stroke-width:1.8; marker-end:url(#ex-arrow); }
    </style>
  </defs>
  <text x="560" y="34" text-anchor="middle" class="title">贯穿例子：加密状态下计算一个二次风险分数</text>
  <rect x="40" y="82" width="180" height="110" class="box data"/>
  <text x="130" y="112" text-anchor="middle" class="h">原始输入</text>
  <text x="130" y="142" text-anchor="middle" class="b">用户特征向量 z</text>
  <text x="130" y="166" text-anchor="middle" class="b">例如 [年龄, 指标]</text>
  <line x1="220" y1="137" x2="260" y2="137" class="arrow"/>
  <rect x="260" y="82" width="180" height="110" class="box plain"/>
  <text x="350" y="112" text-anchor="middle" class="h">编码</text>
  <text x="350" y="142" text-anchor="middle" class="b">z → m(X)</text>
  <text x="350" y="166" text-anchor="middle" class="b">scale = Δ</text>
  <line x1="440" y1="137" x2="480" y2="137" class="arrow"/>
  <rect x="480" y="82" width="180" height="110" class="box cipher"/>
  <text x="570" y="112" text-anchor="middle" class="h">加密</text>
  <text x="570" y="142" text-anchor="middle" class="b">m(X) → c</text>
  <text x="570" y="166" text-anchor="middle" class="b">密文两多项式</text>
  <line x1="660" y1="137" x2="700" y2="137" class="arrow"/>
  <rect x="700" y="82" width="180" height="110" class="box compute"/>
  <text x="790" y="112" text-anchor="middle" class="h">密文计算</text>
  <text x="790" y="142" text-anchor="middle" class="b">r(z)=a z²+b z+c</text>
  <text x="790" y="166" text-anchor="middle" class="b">乘法后重线性化/重缩放</text>
  <line x1="880" y1="137" x2="920" y2="137" class="arrow"/>
  <rect x="920" y="82" width="160" height="110" class="box result"/>
  <text x="1000" y="112" text-anchor="middle" class="h">解密解码</text>
  <text x="1000" y="142" text-anchor="middle" class="b">得到近似结果</text>
  <text x="1000" y="166" text-anchor="middle" class="b">r(z)</text>
  <path d="M790 205 C790 255 350 255 350 205" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="8 7"/>
  <text x="570" y="285" text-anchor="middle" class="b">整组文章围绕这条链路展开：先解决表示，再解决安全计算，最后管理误差和计算预算。</text>
</svg>
