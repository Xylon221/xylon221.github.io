<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <style>
      text { font-family: "Times New Roman", "Noto Serif SC", serif; fill: #111827; }
      .axis { stroke: #9ca3af; stroke-width: 2; fill: none; marker-end: url(#arrow-gray); }
      .dash { stroke: #111827; stroke-width: 3; stroke-dasharray: 12 10; fill: none; }
      .circle { stroke: #111827; stroke-width: 2.2; fill: none; }
      .root { stroke: #1d4ed8; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .omega { fill: #1d4ed8; font-size: 42px; font-style: italic; }
      .formula { font-size: 50px; font-style: italic; }
    </style>
  </defs>

  <line x1="110" y1="245" x2="650" y2="245" class="axis"/>
  <line x1="380" y1="500" x2="380" y2="40" class="axis"/>

  <circle cx="380" cy="245" r="155" class="circle"/>
  <line x1="225" y1="245" x2="535" y2="245" class="dash"/>
  <line x1="380" y1="90" x2="380" y2="400" class="dash"/>

  <path d="M 380 245 L 488 137" class="root"/>
  <path d="M 380 245 L 272 137" class="root"/>
  <path d="M 380 245 L 272 353" class="root"/>
  <path d="M 380 245 L 488 353" class="root"/>

  <text x="520" y="110" class="omega">ω<tspan baseline-shift="super" font-size="28">1</tspan></text>
  <text x="155" y="110" class="omega">ω<tspan baseline-shift="super" font-size="28">3</tspan></text>
  <text x="155" y="420" class="omega">ω<tspan baseline-shift="super" font-size="28">5</tspan></text>
  <text x="520" y="420" class="omega">ω<tspan baseline-shift="super" font-size="28">7</tspan></text>

  <text x="380" y="535" text-anchor="middle" class="formula">Φ<tspan baseline-shift="sub" font-size="32">8</tspan>(X) = 1 + X<tspan baseline-shift="super" font-size="32">4</tspan></text>
</svg>
