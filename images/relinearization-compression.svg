<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="350" viewBox="0 0 1050 350">
  <defs>
    <marker id="rel-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#1e293b"/>
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans SC", sans-serif; fill:#111827; }
      .title { font-size:25px; font-weight:700; }
      .box { rx:12; stroke:#1e293b; stroke-width:1.5; }
      .a { fill:#dbeafe; }
      .b { fill:#ede9fe; }
      .c { fill:#dcfce7; }
      .h { font-size:20px; font-weight:700; }
      .body { font-size:15px; fill:#334155; }
      .arrow { stroke:#1e293b; stroke-width:1.8; marker-end:url(#rel-arrow); }
    </style>
  </defs>
  <text x="525" y="38" text-anchor="middle" class="title">重线性化：把三分量密文压回二分量密文</text>
  <rect x="70" y="95" width="250" height="130" class="box a"/>
  <text x="195" y="130" text-anchor="middle" class="h">普通密文</text>
  <text x="195" y="163" text-anchor="middle" class="body">(c₀, c₁)</text>
  <text x="195" y="190" text-anchor="middle" class="body">解密：c₀ + c₁s</text>
  <line x1="320" y1="160" x2="390" y2="160" class="arrow"/>
  <text x="355" y="145" text-anchor="middle" class="body">乘法</text>
  <rect x="390" y="95" width="270" height="130" class="box b"/>
  <text x="525" y="130" text-anchor="middle" class="h">乘法后</text>
  <text x="525" y="163" text-anchor="middle" class="body">(d₀, d₁, d₂)</text>
  <text x="525" y="190" text-anchor="middle" class="body">解密：d₀ + d₁s + d₂s²</text>
  <line x1="660" y1="160" x2="730" y2="160" class="arrow"/>
  <text x="695" y="145" text-anchor="middle" class="body">Relin + evk</text>
  <rect x="730" y="95" width="250" height="130" class="box c"/>
  <text x="855" y="130" text-anchor="middle" class="h">重线性化后</text>
  <text x="855" y="163" text-anchor="middle" class="body">(d₀', d₁')</text>
  <text x="855" y="190" text-anchor="middle" class="body">仍用普通解密</text>
</svg>
