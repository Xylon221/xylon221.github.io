<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="只想睡大觉的书房，收录技术笔记、生活思考与日常片段。">
  <meta name="theme-color" content="#f4f7fa">
  <title>书房 · 只想睡大觉</title>
  <link rel="icon" href="/images/favicon-32x32-next.png">
  <link rel="stylesheet" href="/css/reading-room.css?v=20261118-kai">
  <link rel="stylesheet" href="/css/site-shell.css?v=20261119-gallery">
  <link rel="stylesheet" href="/css/room-home.css?v=20261119-gallery">
  <script type="module" src="/js/site-shell.js?v=20261119-gallery"></script>
  <script type="module" src="/js/reading-room.js?v=20261119-gallery"></script>
  <script type="module" src="/js/room-desk.js?v=1"></script>
</head>
<body class="room-page room-home">
  <header class="room-header">
    <div class="room-shell header-content">
      <a class="brand" href="/">只想睡大觉</a>
      <nav aria-label="全站导航"><a href="/reading-room/">书房</a><a href="/archives/">归档</a><a href="/tags/">标签</a><a href="/about/">关于</a></nav>
    </div>
  </header>
  <a class="skip-link" href="#articles">跳到文章画廊</a>
  <template id="owner-photo">
    <figure class="rail-portrait"><img src="/images/owner-snow.webp" alt="站主在雪地中手持登山杖" width="1000" height="1346" decoding="async"></figure>
  </template>
  <main class="home-frame">
    <section class="study-gallery" id="articles" aria-labelledby="study-title" tabindex="0">
      <header class="study-heading">
        <h1 id="study-title">书房</h1>
        <p>记所学、所思、所见。</p>
      </header>
      <nav class="study-tabs" aria-label="文章栏目">
        <a href="/learning/" data-gallery-chapter="learning">问学札记</a>
        <a href="/reflection/" data-gallery-chapter="reflection">格物随想</a>
        <a href="/life/" data-gallery-chapter="life">浮生小记</a>
      </nav>
      <nav class="study-filters" id="gallery-filters" aria-label="浮生小记分类" hidden></nav>
      <div class="study-list-header">
        <h2 id="gallery-heading">问学札记</h2>
        <div class="study-actions">
          <button type="button" id="resume-gallery-draft" hidden>继续草稿</button>
          <button type="button" id="new-gallery-draft">＋ 新建</button>
        </div>
      </div>
      <p id="gallery-status" role="status">正在读取文章…</p>
      <div id="gallery-posts" class="study-cards"></div>
      <noscript><p>可在<a href="/archives/">归档</a>中浏览所有文章。</p></noscript>
    </section>

    <aside class="study-desk" aria-label="月历和随手记" tabindex="0">
      <section aria-labelledby="desk-month">
        <div class="study-panel-heading">
          <h2 id="desk-month">月历</h2>
          <div class="study-month-actions">
            <button type="button" id="desk-prev-month" aria-label="上个月">‹</button>
            <button type="button" id="desk-today">今天</button>
            <button type="button" id="desk-next-month" aria-label="下个月">›</button>
          </div>
        </div>
        <div class="study-week" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div class="study-calendar" id="desk-mini-calendar" aria-label="选择日期"></div>
      </section>
      <section class="study-notes" aria-labelledby="desk-note-heading">
        <div class="study-panel-heading">
          <h2 id="desk-note-heading">随手记</h2>
          <time id="desk-note-date"></time>
        </div>
        <p id="desk-mini-status" role="status"></p>
        <form id="desk-mini-login">
          <label for="desk-mini-key">站主密钥</label>
          <div class="study-login-row">
            <input id="desk-mini-key" type="password" autocomplete="current-password" spellcheck="false" minlength="43" maxlength="43" required>
            <button type="submit">登录</button>
          </div>
        </form>
        <div id="desk-mini-private" hidden>
          <ul id="desk-mini-notes" class="study-note-list"></ul>
          <form id="desk-mini-note-form">
            <textarea id="desk-mini-note" aria-label="随手记内容" placeholder="记一件小事…" rows="3" maxlength="4000" required></textarea>
            <button type="submit">保存</button>
          </form>
        </div>
        <a class="study-daily-link" href="/daily-todo/">打开 Daily Todo</a>
      </section>
    </aside>
  </main>

  <dialog class="study-editor" id="gallery-editor" aria-labelledby="gallery-editor-title">
    <header>
      <h2 id="gallery-editor-title">写作</h2>
      <button type="button" id="expand-gallery-editor" aria-label="展开为全页写作" title="展开为全页写作">⤢</button>
      <button type="button" id="close-gallery-editor" aria-label="关闭编辑区" title="关闭编辑区">×</button>
    </header>
    <p id="gallery-editor-status" role="status" hidden></p>
    <iframe id="gallery-editor-frame" title="文章编辑器"></iframe>
  </dialog>
</body>
</html>
