<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self' https://api.github.com; form-action 'none'; base-uri 'none'">
  <meta name="robots" content="noindex">
  <title>写作 · 只想睡大觉</title>
  <link rel="icon" href="/images/favicon-32x32-next.png">
  <link rel="stylesheet" href="/css/reading-room.css?v=20261110-columns">
  <link rel="stylesheet" href="/vendor/quill-2.0.3/quill.core.css">
  <link rel="stylesheet" href="/css/article-text.css?v=1">
  <link rel="stylesheet" href="/css/write.css?v=20261119-gallery">
  <link rel="stylesheet" href="/css/site-shell.css?v=20261119-gallery">
  <script defer src="/vendor/quill-2.0.3/quill.js"></script>
  <script type="module" src="/js/site-shell.js?v=20261119-gallery"></script>
  <script type="module" src="/js/write.js?v=20261119-gallery"></script>
</head>
<body>
  <header class="room-header"><div class="room-shell header-content">
    <a class="brand" href="/">只想睡大觉</a>
    <nav aria-label="页面导航"><a href="/reading-room/" id="write-return">返回书房</a></nav>
  </div></header>
  <main class="room-shell write-shell">
    <h1 class="write-heading">写作</h1>
    <div class="write-toolbar">
      <div class="write-modes" role="group" aria-label="写作类型">
        <button type="button" data-mode="note" aria-pressed="false" disabled>写生活记录</button>
        <button type="button" data-mode="article" aria-pressed="true" disabled>写文章</button>
        <button type="button" data-mode="edit" aria-pressed="false" disabled>编辑已发布</button>
      </div>
      <a id="write-context-return" href="/reading-room/" hidden>返回书房</a>
      <p id="draft-status" role="status" aria-live="polite">草稿保存在当前浏览器</p>
    </div>
    <noscript><p>请启用 JavaScript 后使用网页写作。</p></noscript>
    <section class="write-load" id="edit-picker" aria-label="选择已发布的文章" hidden>
      <label class="write-label">已发布的文章<select id="edit-article"><option value="">选择要修改的文章</option></select></label>
      <button type="button" id="edit-load">载入</button>
      <a id="edit-view" target="_blank" rel="noopener" hidden>查看线上原文 ↗</a>
      <button type="button" id="edit-refresh" hidden>重新载入线上版本</button>
    </section>
    <form id="write-form" data-mode="article">
      <fieldset id="write-fields" disabled>
        <div id="write-properties">
          <label class="write-label"><span id="title-label">标题</span><input id="post-title" required maxlength="120" placeholder="给这篇文章起个名字"></label>
          <div class="write-meta">
            <label class="write-label">栏目<select id="post-category" required></select></label>
            <label class="write-label">日期<input id="post-date" type="date" required></label>
            <label class="write-label">标签（选填）<input id="post-tags" maxlength="250" placeholder="读书、生活（用逗号隔开）"></label>
          </div>
        </div>

        <div class="write-cover">
          <img id="post-cover-preview" alt="文章封面预览" hidden>
          <label class="write-label">封面（选填）<input id="post-cover" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif"></label>
          <button type="button" id="remove-post-cover" hidden>移除封面</button>
        </div>
        <section class="write-content" id="write-content" aria-labelledby="content-title">
          <div class="write-bar"><h2 id="content-title">正文</h2><div>
            <button type="button" id="add-text">＋ 文字</button>
            <button type="button" id="add-image">＋ 图片</button>
          </div></div>
          <input id="image-files" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" multiple hidden>
          <div id="content-blocks"></div>
          <p id="image-error" class="write-error" role="alert"></p>
        </section>

        <details class="write-options" id="note-options" hidden><summary>标题、分类、日期和标签</summary></details>
        <section class="write-actions" aria-label="预览和发布">
          <button type="button" id="show-preview">预览</button>
          <details class="write-auth" id="publish-options">
            <summary id="publish-summary">准备发布</summary>
            <div class="publish-fields">
              <label class="write-label">GitHub 发布令牌<input type="password" id="github-token" autocomplete="off" spellcheck="false" placeholder="发布时填写"></label>
              <button class="write-primary" id="publish-button" type="submit">发布文章</button>
            </div>
            <p id="publish-target">发布后的文章可以在书房和归档查看。</p>
            <details><summary>如何获取令牌</summary><p>在 GitHub 创建细粒度令牌，选择仓库 <strong>xylon221.github.io</strong>，将 <strong>Contents</strong> 设为 <strong>Read and write</strong>。令牌只用于本次发布请求。</p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">去 GitHub 创建令牌 ↗</a></details>
          </details>
        </section>
      </fieldset>
    </form>
    <div id="write-status" role="status" aria-live="polite"></div>
    <article id="write-preview" class="write-preview" aria-label="发布预览" tabindex="-1" hidden>
      <p class="eyebrow">发布预览</p><h2></h2><p class="preview-meta"></p><div class="write-prose article-text"></div>
      <button type="button" id="resume-writing">继续编辑</button>
    </article>
  </main>

  <template id="text-block"><div class="write-block" data-kind="text">
    <div class="write-rich">
      <div class="write-format" role="group" aria-label="文字格式">
        <button type="button" class="ql-bold" title="加粗（Ctrl 或 ⌘ + B）" aria-label="加粗"><strong>B</strong></button>
        <button type="button" class="ql-italic" title="斜体（Ctrl 或 ⌘ + I）" aria-label="斜体"><em>I</em></button>
        <button type="button" class="ql-underline" title="下划线（Ctrl 或 ⌘ + U）" aria-label="下划线"><u>U</u></button>
        <select class="ql-color" aria-label="文字颜色">
          <option value="" selected disabled>文字颜色</option><option value="default">恢复默认</option>
          <option value="ink">黑色</option><option value="red">红色</option><option value="blue">蓝色</option>
          <option value="green">绿色</option><option value="purple">紫色</option>
        </select>
        <select class="ql-background" aria-label="高亮颜色">
          <option value="" selected disabled>高亮颜色</option><option value="default">无高亮</option>
          <option value="yellow">浅黄</option><option value="mint">浅绿</option><option value="sky">浅蓝</option><option value="pink">浅粉</option>
        </select>
        <button type="button" class="ql-clean" title="清除所选文字的格式">清除格式</button>
      </div>
      <div class="write-editor"></div>
    </div>
    <button type="button" class="remove-block">移除这段</button>
  </div></template>
  <template id="image-block"><div class="write-block write-image" data-kind="image">
    <img alt="待发布的图片"><div><p class="image-name"></p>
    <label class="write-label">图片说明（选填）<input maxlength="120" placeholder="描述这张图片"></label>
    <button type="button" class="remove-block">移除图片</button></div>
  </div></template>
  <template id="original-block"><div class="write-block write-original" data-kind="original">
    <label class="write-label"><span>原文文字（保留排版）</span><textarea rows="3"></textarea></label>
    <p class="original-preview" hidden></p>
    <button type="button" class="remove-block">移除此段</button>
  </div></template>
</body>
</html>
